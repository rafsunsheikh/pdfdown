[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdfdown"
version = "0.1.2"
description = "A terminal app that turns PDFs, especially research articles, into clean Markdown with tables, cropped figures and equations."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "Md Rafsun Sheikh" }]
keywords = ["pdf", "markdown", "tui", "research", "latex", "docling"]
dependencies = [
  "docling>=2.60",
  "pypdfium2>=4.30",
  "pillow>=10",
  "latex2mathml>=3.77",
  "pix2tex>=0.1.4",
  "textual>=0.80",
  "textual-image>=0.8",
  "mcp>=2.3,<3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pdfdown = "pdfdown.cli:main"

[project.urls]
Homepage = "https://github.com/rafsunsheikh/pdfdown"
Issues = "https://github.com/rafsunsheikh/pdfdown/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.sdist]
exclude = ["examples", "docs", "out", "pdfdown-output", "scripts/drive_tui.py", "scripts/readline_probe.py", "scripts/pty_quit_test.py"]
