[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdfdown"
version = "0.1.3"
description = "A terminal app that turns PDFs, especially research articles, into clean Markdown with tables, cropped figures and equations."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "Md Rafsun Sheikh" }]
keywords = ["pdf", "markdown", "tui", "research", "latex", "docling"]
dependencies = [
  "docling>=2.60",
  "pypdfium2>=4.30",
  "pillow>=10",
  "latex2mathml>=3.77",
  "pix2tex>=0.1.4",
  "textual>=0.80",
  "textual-image>=0.8",
  "mcp>=2.3,<3",
  "easyocr>=1.7",  # Bangla OCR: RapidOCR and Apple Vision have no Bangla model
  "bijoy2unicode>=0.1.1",  # letter table for Bangla in old Bijoy fonts (SutonnyMJ ...)
  # Tesseract for Bangla scans, built in. Only where tesserocr has prebuilt files: elsewhere pip would try to compile
  # it and fail the whole install (macOS 15 is Darwin 24). Without it, Bangla scans use EasyOCR.
  "tesserocr>=2.12.0; (sys_platform == 'darwin' and platform_release >= '24') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pdfdown = "pdfdown.cli:main"

[project.urls]
Homepage = "https://github.com/rafsunsheikh/pdfdown"
Issues = "https://github.com/rafsunsheikh/pdfdown/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.sdist]
exclude = ["examples", "docs", "out", "pdfdown-output", "scripts/drive_tui.py", "scripts/readline_probe.py", "scripts/pty_quit_test.py"]
