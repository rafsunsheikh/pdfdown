# Run the test suite on Windows, macOS and Linux for every push and pull request.
# Windows is the one the maintainer cannot test by hand; GitHub's runners are ordinary 4-core CPU machines with no
# GPU, close to a consumer laptop. The first run downloads about 1 GB of models; they are cached between runs.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "0"  # test with the console's own code page, as a user's Windows has it
      HF_HOME: ${{ github.workspace }}/.models/hf
      EASYOCR_MODULE_PATH: ${{ github.workspace }}/.models/easyocr
      TORCH_HOME: ${{ github.workspace }}/.models/torch
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install pdfdown as a user would (from the built wheel)
        shell: bash
        run: |
          uv build --wheel -o dist-ci
          uv venv .venv
          uv pip install --python .venv dist-ci/*.whl pytest
      - name: Check the command works
        shell: bash
        run: .venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/pdfdown --version
      - name: Run the tests
        shell: bash
        run: .venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/python -m pytest -q -x --durations=10

  # The one-line installers, as a new user runs them, on the package built from this commit.
  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the package
        run: uv build --wheel -o dist-ci
      - name: Run install.ps1
        shell: powershell
        env:
          CI: "1"
          PDFDOWN_NO_TERMINAL: "1"  # winget is not set up on the runner images
        run: |
          $env:PDFDOWN_SPEC = (Get-ChildItem dist-ci\*.whl).FullName
          .\install.ps1
      - name: pdfdown works in a new shell, and the Start-menu shortcut exists
        shell: powershell
        run: |
          $bin = (uv tool dir --bin).Trim()
          & "$bin\pdfdown.exe" --version
          & "$bin\pdfdown.exe" --batch --json corpus\bangla-sample-scan.pdf -o out | Out-File -Encoding utf8 result.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content result.json -Encoding utf8 | Select-String '"markdown"'
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\pdfdown.lnk")) { exit 1 }
      - name: The npm launcher starts pdfdown
        shell: bash
        run: |
          cp install.ps1 install.sh packaging/npm/
          PDFDOWN_PIP_SPEC="$(ls dist-ci/*.whl)" node packaging/npm/bin/pdfdown.js --version

  installer-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the package
        run: uv build --wheel -o dist-ci
      - name: Run install.sh
        run: PDFDOWN_SPEC="$(ls $PWD/dist-ci/*.whl)" sh install.sh
      - name: pdfdown works
        run: |
          "$(uv tool dir --bin)/pdfdown" --version
          "$(uv tool dir --bin)/pdfdown" --batch corpus/bangla-sample-scan.pdf -o out
